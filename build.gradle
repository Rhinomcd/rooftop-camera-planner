plugins {
    id 'java'
}

repositories {
    mavenLocal()
    maven { url = 'https://repo.runelite.net' }
    mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.rhinomcd.rooftoplens.RooftopLensPluginTest'

dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.11.0'
    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}

group = 'com.rhinomcd.rooftoplens'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('run', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = pluginMainClass
    jvmArgs '-ea', '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED'
    args '--developer-mode', '--debug'
}

tasks.named('jar', Jar) {
    metaInf {
        from 'LICENSE'
        from 'THIRD_PARTY_NOTICES.md'
    }
}

tasks.register('replay', JavaExec) {
    description = 'Replays a Rooftop Lens recording: ./gradlew replay -Precording=<file.jsonl>'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.rhinomcd.rooftoplens.ReplayMain'
    args project.findProperty('recording') ?: '', layout.buildDirectory.dir('replay').get().asFile.path
    systemProperty 'java.awt.headless', 'true'
}
